<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight Auth</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="container-fluid auth-page">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-5">

            <div class="auth-card glow-card">
                <h1 class="brand-logo text-center">FinSight</h1>
                <p class="auth-subtitle text-center">
                    AI Powered Financial Intelligence
                </p>

                <div class="auth-tabs">
                    <button id="login-tab" class="tab-btn active">Login</button>
                    <button id="register-tab" class="tab-btn">Register</button>
                </div>

                <!-- LOGIN -->
                <form id="login-form">
                    <div class="mb-3">
                        <input id="login-email" type="email" class="form-control custom-input" placeholder="Email">
                    </div>

                    <div class="mb-3 input-group">
                        <input id="login-password" type="password" class="form-control custom-input border-end-0" placeholder="Password">
                        <button type="button" class="btn custom-icon-btn toggle-password border-start-0" data-target="login-password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="primary-btn auth-btn w-100">
                        Login
                    </button>
                </form>

                <!-- REGISTER -->
                <form id="register-form" class="d-none">
                    <div class="mb-2">
                        <input id="register-username" type="text" class="form-control custom-input" placeholder="Username">
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <input id="register-firstname" type="text" class="form-control custom-input" placeholder="First Name">
                        </div>

                        <div class="col-6">
                            <input id="register-lastname" type="text" class="form-control custom-input" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="mt-2 mb-2">
                        <input id="register-email" type="email" class="form-control custom-input" placeholder="Email">
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <div class="input-group">
                                <input id="register-password" type="password" class="form-control custom-input border-end-0" placeholder="Password">
                                <button type="button" class="btn custom-icon-btn toggle-password border-start-0" data-target="register-password" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="input-group">
                                <input id="register-confirm-password" type="password" class="form-control custom-input border-end-0" placeholder="Confirm Password">
                                <button type="button" class="btn custom-icon-btn toggle-password border-start-0" data-target="register-confirm-password" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="password-policy-container" class="mt-2 mb-3 text-muted-custom" style="font-size: 0.8rem; display: none;">
                        <div class="fw-semibold mb-1 text-light">Password must contain:</div>
                        <ul class="list-unstyled mb-0" id="password-policy-list">
                            <li id="req-length"><i class="bi bi-circle me-1"></i> At least 8 characters</li>
                            <li id="req-upper"><i class="bi bi-circle me-1"></i> One uppercase letter</li>
                            <li id="req-lower"><i class="bi bi-circle me-1"></i> One lowercase letter</li>
                            <li id="req-number"><i class="bi bi-circle me-1"></i> One number</li>
                            <li id="req-special"><i class="bi bi-circle me-1"></i> One special character</li>
                        </ul>
                    </div>
                    <div id="password-mismatch-error" class="text-danger mt-1 mb-2 fw-medium" style="font-size: 0.85rem; display: none;">
                        Passwords do not match
                    </div>
                    
                    <div id="register-error-message" class="text-danger mb-3 fw-medium text-center" style="font-size: 0.9rem; display: none;"></div>

                    <button type="submit" class="primary-btn auth-btn w-100">
                        Register
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
